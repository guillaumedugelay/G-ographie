<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quel pays est le plus grand ?</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --txt:#f1f5f9; --mute:#94a3b8; --ok:#22c55e; --ko:#ef4444; --acc:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; padding:16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; text-align:center; }
  .sub { color:var(--mute); margin-bottom:20px; text-align:center; }
  .scores { display:flex; gap:24px; margin-bottom:20px; }
  .scores div { text-align:center; color:var(--mute); font-size:.85rem; }
  .scores b { display:block; font-size:1.8rem; color:var(--txt); }
  .duel { display:flex; gap:16px; width:100%; max-width:640px; }
  .country { flex:1; background:var(--card); border:3px solid transparent; border-radius:16px; padding:28px 12px;
             color:var(--txt); font:inherit; cursor:pointer; transition:transform .1s, border-color .2s; }
  .country:hover:not(:disabled) { transform:translateY(-3px); border-color:var(--acc); }
  .country:disabled { cursor:default; }
  .flag { font-size:4rem; line-height:1; }
  .name { font-size:1.2rem; font-weight:600; margin-top:12px; }
  .area { margin-top:8px; color:var(--mute); min-height:1.4em; }
  .country.ok { border-color:var(--ok); }
  .country.ko { border-color:var(--ko); }
  .msg { margin:20px 0 10px; min-height:1.6em; font-weight:600; text-align:center; }
  button.action { background:var(--acc); color:#0f172a; border:0; border-radius:10px; padding:12px 24px;
                  font:inherit; font-weight:700; cursor:pointer; }
  .hidden { display:none; }
  @media (max-width:480px) { .duel { flex-direction:column; } .country { padding:18px 12px; } .flag { font-size:3rem; } }
</style>
</head>
<body>
  <h1>🌍 Quel pays est le plus grand ?</h1>
  <div class="sub">Clique sur le pays qui a la plus grande superficie.</div>
  <div class="scores">
    <div>Série<b id="score">0</b></div>
    <div>Record<b id="best">0</b></div>
  </div>
  <div class="duel">
    <button class="country" id="c0"></button>
    <button class="country" id="c1"></button>
  </div>
  <div class="msg" id="msg"></div>
  <button class="action hidden" id="next"></button>

<script>
// [code ISO, nom, superficie en km²]
const DATA = [
["RU","Russie",17098246],["CA","Canada",9984670],["CN","Chine",9596961],["US","États-Unis",9833517],
["BR","Brésil",8515767],["AU","Australie",7692024],["IN","Inde",3287263],["AR","Argentine",2780400],
["KZ","Kazakhstan",2724900],["DZ","Algérie",2381741],["CD","RD Congo",2344858],["SA","Arabie saoudite",2149690],
["MX","Mexique",1964375],["ID","Indonésie",1904569],["SD","Soudan",1861484],["LY","Libye",1759540],
["IR","Iran",1648195],["MN","Mongolie",1564116],["PE","Pérou",1285216],["TD","Tchad",1284000],
["NE","Niger",1267000],["AO","Angola",1246700],["ML","Mali",1240192],["ZA","Afrique du Sud",1221037],
["CO","Colombie",1141748],["ET","Éthiopie",1104300],["BO","Bolivie",1098581],["MR","Mauritanie",1030700],
["EG","Égypte",1002450],["TZ","Tanzanie",945087],["NG","Nigeria",923768],["VE","Venezuela",916445],
["PK","Pakistan",881913],["NA","Namibie",825615],["MZ","Mozambique",801590],["TR","Turquie",783562],
["CL","Chili",756102],["ZM","Zambie",752612],["MM","Myanmar",676578],["AF","Afghanistan",652230],
["SO","Somalie",637657],["CF","Centrafrique",622984],["UA","Ukraine",603550],["MG","Madagascar",587041],
["BW","Botswana",581730],["KE","Kenya",580367],["FR","France",551695],["YE","Yémen",527968],
["TH","Thaïlande",513120],["ES","Espagne",505990],["TM","Turkménistan",488100],["CM","Cameroun",475440],
["PG","Papouasie-Nouvelle-Guinée",462840],["SE","Suède",450295],["UZ","Ouzbékistan",447400],["MA","Maroc",446550],
["IQ","Irak",438317],["PY","Paraguay",406752],["ZW","Zimbabwe",390757],["JP","Japon",377975],
["DE","Allemagne",357022],["CG","Congo",342000],["FI","Finlande",338145],["VN","Vietnam",331212],
["MY","Malaisie",330803],["NO","Norvège",323802],["CI","Côte d'Ivoire",322463],["PL","Pologne",312696],
["OM","Oman",309500],["IT","Italie",301340],["PH","Philippines",300000],["EC","Équateur",283561],
["BF","Burkina Faso",272967],["NZ","Nouvelle-Zélande",268838],["GA","Gabon",267668],["GN","Guinée",245857],
["GB","Royaume-Uni",243610],["UG","Ouganda",241038],["GH","Ghana",238533],["RO","Roumanie",238397],
["LA","Laos",236800],["GY","Guyana",214969],["BY","Biélorussie",207600],["KG","Kirghizistan",199951],
["SN","Sénégal",196722],["SY","Syrie",185180],["KH","Cambodge",181035],["UY","Uruguay",176215],
["SR","Suriname",163820],["TN","Tunisie",163610],["BD","Bangladesh",147570],["NP","Népal",147181],
["TJ","Tadjikistan",143100],["GR","Grèce",131957],["NI","Nicaragua",130373],["KP","Corée du Nord",120538],
["MW","Malawi",118484],["ER","Érythrée",117600],["BJ","Bénin",114763],["HN","Honduras",112492],
["LR","Libéria",111369],["BG","Bulgarie",110879],["CU","Cuba",109884],["GT","Guatemala",108889],
["IS","Islande",103000],["KR","Corée du Sud",100210],["HU","Hongrie",93028],["PT","Portugal",92090],
["JO","Jordanie",89342],["RS","Serbie",88361],["AZ","Azerbaïdjan",86600],["AT","Autriche",83871],
["AE","Émirats arabes unis",83600],["CZ","Tchéquie",78867],["PA","Panama",75417],["SL","Sierra Leone",71740],
["IE","Irlande",70273],["GE","Géorgie",69700],["LK","Sri Lanka",65610],["LT","Lituanie",65300],
["LV","Lettonie",64589],["TG","Togo",56785],["HR","Croatie",56594],["BA","Bosnie-Herzégovine",51209],
["CR","Costa Rica",51100],["SK","Slovaquie",49035],["DO","République dominicaine",48671],["EE","Estonie",45228],
["DK","Danemark",43094],["NL","Pays-Bas",41850],["CH","Suisse",41285],["BT","Bhoutan",38394],
["TW","Taïwan",36193],["GW","Guinée-Bissau",36125],["MD","Moldavie",33846],["BE","Belgique",30528],
["LS","Lesotho",30355],["AM","Arménie",29743],["AL","Albanie",28748],["SV","Salvador",21041],
["SI","Slovénie",20273],["FJ","Fidji",18272],["KW","Koweït",17818],["SZ","Eswatini",17364],
["TL","Timor oriental",14874],["QA","Qatar",11586],["JM","Jamaïque",10991],["LB","Liban",10452],
["CY","Chypre",9251],["LU","Luxembourg",2586],["MU","Maurice",2040],["MT","Malte",316],
["LI","Liechtenstein",160],["SM","Saint-Marin",61],["MC","Monaco",2]
].map(([code,name,area]) => ({
  name, area,
  flag: [...code].map(c => String.fromCodePoint(127397 + c.charCodeAt(0))).join("")
}));

const fmt = n => n.toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " km²";
const $ = id => document.getElementById(id);
const btns = [$("c0"), $("c1")];
const rand = () => DATA[Math.floor(Math.random() * DATA.length)];

let score = 0, kept = null, pair = [], locked = false;
let best = 0;
try { best = +localStorage.getItem("geo-best") || 0; } catch {}
$("best").textContent = best;

function randomOther(not) {
  let c;
  do { c = rand(); } while (c === not);
  return c;
}

function render() {
  pair.forEach((c, i) => {
    btns[i].className = "country";
    btns[i].disabled = false;
    btns[i].innerHTML = `<div class="flag">${c.flag}</div><div class="name">${c.name}</div><div class="area">?</div>`;
  });
  $("msg").textContent = "";
  $("next").classList.add("hidden");
  locked = false;
}

function newRound() {
  if (kept) {
    pair = [kept, randomOther(kept)];
    if (Math.random() < 0.5) pair.reverse();
  } else {
    const a = rand();
    pair = [a, randomOther(a)];
  }
  render();
}

function answer(i) {
  if (locked) return;
  locked = true;
  const bigger = pair[0].area > pair[1].area ? 0 : 1;
  btns.forEach((b, j) => {
    b.disabled = true;
    b.querySelector(".area").textContent = fmt(pair[j].area);
    b.classList.add(j === bigger ? "ok" : (j === i ? "ko" : ""));
  });
  const next = $("next");
  next.classList.remove("hidden");
  if (i === bigger) {
    score++;
    $("score").textContent = score;
    if (score > best) {
      best = score; $("best").textContent = best;
      try { localStorage.setItem("geo-best", best); } catch {}
    }
    kept = pair[Math.random() < 0.5 ? 0 : 1];  // on garde l'un des deux au hasard
    $("msg").textContent = `✅ Bravo ! On garde ${kept.name}.`;
    next.textContent = "Suivant →";
  } else {
    $("msg").textContent = `❌ Raté ! C'était ${pair[bigger].name}. Score final : ${score}`;
    kept = null; score = 0;
    $("score").textContent = 0;
    next.textContent = "Rejouer";
  }
  next.focus();
}

btns.forEach((b, i) => b.addEventListener("click", () => answer(i)));
$("next").addEventListener("click", newRound);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") answer(0);
  else if (e.key === "ArrowRight") answer(1);
});
newRound();
</script>
</body>
</html>
