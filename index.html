<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeux de géographie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Russo+One&display=swap">
<link rel="stylesheet" href="css/jeux.css">
</head><body>
<div id="ver">v19</div>
<main id="app"></main>
<script type="module">
import{icon}from"./js/icons.js";
const JEUX={
  "À deux":[
    ["duel/duel.html","swords","c1","Duel varié","20 manches : superficie, population, côtes, densité"],
    ["classement/classement.html?jeu=altitude","mountain","c3","Le plus haut sommet","Classe 10 pays selon leur point culminant"],
    ["classement/classement.html?jeu=corruption","scale","c2","Le moins corrompu","Classe 10 pays selon l'indice de corruption"],
    ["classement/classement.html?jeu=presse","newspaper","c4","La presse la plus libre","Classe 10 pays selon la liberté de la presse"],
  ],
  "Solo":[
    ["carte/carte.html","pin","c5","Où est ce pays ?","10 pays à retrouver sur la carte du monde"],
    ["solo/solo.html?jeu=superficie","map","c1","Le plus grand","Quel pays a la plus grande superficie ?"],
    ["solo/solo.html?jeu=altitude","mountain","c3","Le plus haut sommet","Quel pays a le point culminant le plus haut ?"],
    ["solo/solo.html?jeu=bonheur","smile","c6","Le plus heureux","Quel pays est le plus heureux ?"],
    ["solo/solo.html?jeu=alcool","wine","c7","Qui boit le plus ?","Dans quel pays consomme-t-on le plus d'alcool ?"],
  ],
};
let h=`<h1>${icon("globe")}Jeux de géographie</h1>
  <p class="hint">Les jeux à deux démarrent dès qu'un autre joueur ouvre le même jeu.</p>`;
for(const [section,list] of Object.entries(JEUX)){
  h+=`<h2 class="section">${section}</h2><nav class="menu" aria-label="${section}">`;
  for(const [href,ic,c,titre,sous] of list)
    h+=`<a class="${c}" href="${href}"><span class="tile">${icon(ic)}</span><span><b>${titre}</b><small>${sous}</small></span></a>`;
  h+=`</nav>`;
}
document.getElementById("app").innerHTML=h;
</script>
</body></html>
