].map(([code,name,area])=>({name,area,pop:(POP[code]||0)*1e6,coast:COAST[code]||0,
  flag:[...code].map(c=>String.fromCodePoint(127397+c.charCodeAt(0))).join("")}));
DATA.forEach(c=>c.dens=c.pop/c.area);
const ROUNDS=20,MAXRATIO=1.75;
const VERSION="14";
document.getElementById("ver").textContent="v"+VERSION;
// Catégories qui alternent : superficie, population, longueur des côtes, densité
const CATS=[
  {key:"area",q:"Quel pays a la plus grande superficie ?",fmt:n=>n.toLocaleString("fr-FR",{maximumFractionDigits:0})+" km²"},
  {key:"pop",q:"Quel pays a le plus d'habitants ?",fmt:n=>n>=1e6?(n/1e6).toLocaleString("fr-FR",{maximumFractionDigits:1})+" M hab.":Math.round(n/1e3).toLocaleString("fr-FR")+" 000 hab."},
  {key:"coast",q:"Quel pays a les côtes les plus longues ?",fmt:n=>n.toLocaleString("fr-FR",{maximumFractionDigits:0})+" km"},
  {key:"dens",q:"Quel pays est le plus densément peuplé ?",fmt:n=>n.toLocaleString("fr-FR",{maximumFractionDigits:n<10?1:0})+" hab./km²"}
];
const val=(c,cat)=>c[CATS[cat].key];
const app=document.getElementById("app");

function makeRounds(){
  const used=new Set(),out=[];
  for(let k=0;k<ROUNDS;k++){
    const cat=k%CATS.length;
    const pool=DATA.map((c,i)=>i).filter(i=>!used.has(i)&&val(DATA[i],cat)>0);
    // Écart maximal : le plus grand des deux vaut au plus 1,75 fois le plus petit
    const close=(i,j)=>{const a=val(DATA[i],cat),b=val(DATA[j],cat);return a!==b&&Math.max(a,b)<=MAXRATIO*Math.min(a,b)};
    let i,j;
    for(const c of pool.sort(()=>Math.random()-.5)){
      const m=pool.filter(x=>x!==c&&close(c,x));
      if(m.length){i=c;j=m[Math.floor(Math.random()*m.length)];break}
    }
    used.add(i);used.add(j);out.push([i,j,cat]);
  }
  return out;
}

// État de la partie : manches tirées par l'hôte, réponses et avancement de chaque joueur
let rounds=null,me=null,op=null,selected=null,selRound=-1;
const fresh=()=>({answers:{},ack:0});
const bigger=k=>{const[i,j,cat]=rounds[k];return val(DATA[i],cat)>val(DATA[j],cat)?0:1};
function scoreOf(p,o){
  let s=0;
  for(let k=0;k<ROUNDS;k++){const x=p.answers[k],y=o.answers[k];if(x!==undefined&&y!==undefined&&x===bigger(k))s++}
  return s;
}
const duo=createDuo({key:"duel-v14",onChange:render,
  onStart(){rounds=makeRounds();me=fresh();op=fresh();duo.send({start:true,rounds})},
  onMessage(m){
    if(m.start){rounds=m.rounds;me=fresh();op=fresh()}
    if(m.a)op.answers[m.a[0]]=m.a[1];
    if(m.ack!==undefined)op.ack=m.ack;
  }});
function validate(r){if(selected===null)return;me.answers[r]=selected;duo.send({a:[r,selected]});render()}
function next(r){me.ack=r+1;duo.send({ack:r+1});render()}

function scoreBar(meScore,oScore,center){
  return `<div class="score">
    <div class="sc a"><div class="n">${esc(duo.me.name||"Toi")}</div><div class="v">${meScore}</div></div>
    <div class="mid">${center}</div>
    <div class="sc b"><div class="n">${esc(duo.oppName())}</div><div class="v">${oScore}</div></div></div>`;
}

function render(){
  const focused=document.activeElement&&document.activeElement.id==="nm";
  let h=`<a class="back" href="../">← Menu</a><h1>Duel des pays</h1>`;
  const common=commonScreen(duo,{intro:"Dès qu'un deuxième joueur arrive sur cette page, vous choisissez vos prénoms puis la partie démarre. 20 manches qui alternent superficie, population, côtes et densité. 1 point par bonne réponse."});
  if(common!==null||!rounds){
    h+=common||"";
  }else{
    const opn=esc(duo.oppName());
    const r=Math.min(me.ack,op.ack);
    const ms=scoreOf(me,op),os=scoreOf(op,me);
    if(duo.forfeit||r>=ROUNDS){
      const res=duo.forfeit==="me"?"Tu as abandonné. "+opn+" gagne":duo.forfeit==="opp"?opn+" a abandonné. Tu gagnes 🏆"
        :ms>os?"Tu as gagné 🏆":ms<os?opn+" a gagné":"Égalité";
      h+=scoreBar(ms,os,"Fin")+`<div class="panel"><div class="big" style="font-size:clamp(2rem,9vw,3rem)">${res}</div>
        <p class="mute" style="text-align:center">${ms} point${ms>1?"s":""} contre ${os}${duo.forfeit?"":" sur "+ROUNDS+" manches"}.</p>
        <div class="row" style="justify-content:center"><button id="again">Rejouer</button></div></div>`;
    }else{
      if(selRound!==r){selected=null;selRound=r}
      const[i,j,cat]=rounds[r],c=[DATA[i],DATA[j]];
      const mine=me.answers[r],theirs=op.answers[r];
      const reveal=mine!==undefined&&theirs!==undefined;
      const best=bigger(r);
      h+=scoreBar(ms,os,`Manche<b>${r+1}/${ROUNDS}</b>`);
      h+=`<h2 class="q">${CATS[cat].q}</h2><div class="duel">`;
      c.forEach((cn,k)=>{
        let cls="card",tag="";
        if(reveal){
          cls+=k===best?" good":" bad";
          const t=[];
          if(mine===k)t.push('<span class="tag a">Toi</span>');
          if(theirs===k)t.push(`<span class="tag b">${opn}</span>`);
          tag=t.join("");
        }else if(mine!==undefined){if(mine===k)cls+=" sel"}
        else if(selected===k)cls+=" sel";
        const dis=mine!==undefined?" disabled":"";
        h+=`<button class="${cls}" data-k="${k}"${dis}><div class="flag">${cn.flag}</div><div class="name">${esc(cn.name)}</div>
          <div class="area">${reveal?CATS[cat].fmt(val(cn,cat)):"?"}</div><div class="tags">${tag}</div></button>`;
      });
      h+="</div>";
      if(reveal){
        const v=(who,pick)=>`<div class="vd ${pick===best?"ok":"ko"}">${who} : ${pick===best?"+1 point":"0 point"}</div>`;
        h+=`<div class="verdict">${v("Toi",mine)}${v(opn,theirs)}</div>`;
        const acked=me.ack>r;
        h+=`<div class="row"><button id="next"${acked?" disabled":""}>${acked?"En attente de "+opn+"…":(r===ROUNDS-1?"Voir le résultat":"Manche suivante")}</button></div>`;
      }else if(mine!==undefined){
        h+=`<p class="mute">Choix validé. En attente de ${opn}…</p>`;
      }else{
        h+=`<div class="row"><button id="ok"${selected===null?" disabled":""}>Valider mon choix</button></div>`;
      }
      h+=`<div class="row" style="justify-content:center"><button class="giveup" id="giveup">Abandonner</button></div>`;
      app.dataset.r=r;
    }
  }
  app.innerHTML=h;
  bindCommon(duo,app);
  if(focused){const nm=document.getElementById("nm");if(nm&&!nm.disabled){nm.focus();nm.setSelectionRange(nm.value.length,nm.value.length)}}
  const $=id=>document.getElementById(id);
  const r=+app.dataset.r;
  app.querySelectorAll(".duel button").forEach(b=>b.onclick=()=>{selected=+b.dataset.k;render()});
  if($("ok"))$("ok").onclick=()=>validate(r);
  if($("next"))$("next").onclick=()=>next(r);
  if($("giveup"))$("giveup").onclick=()=>{if(confirm("Abandonner la partie ? Ton adversaire gagnera."))duo.giveUp()};
  if($("again"))$("again").onclick=()=>{rounds=null;duo.toRoom()};
}
render();
duo.start();
