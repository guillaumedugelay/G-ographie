<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classement des pays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap">
<link rel="stylesheet" href="../css/jeux.css">
</head><body>
<div id="ver"></div>
<main id="app"><h1>Classement</h1><p class="mute">Connexion…</p></main>
<script type="module">
import{createDuo,commonScreen,bindCommon,esc}from"../js/duo.js";
import{JEUX,flag}from"../js/classements.js";

const VERSION="15";
document.getElementById("ver").textContent="v"+VERSION;
const jeuKey=new URLSearchParams(location.search).get("jeu")||"altitude";
const JEU=JEUX[jeuKey]||JEUX.altitude;
const N=10;
const DATA=JEU.data.map(([code,name,v])=>({name,v,flag:flag(code)}));
document.title=JEU.titre;
const app=document.getElementById("app");

// Tire 10 pays au hasard
const draw=()=>DATA.map((c,i)=>i).sort(()=>Math.random()-.5).slice(0,N);

let picks=null,mine=[],submitted=null,theirs=null;
const duo=createDuo({key:"classement-"+jeuKey+"-v15",onChange:render,
  onStart(){picks=draw();reset();duo.send({start:true,picks})},
  onMessage(m){
    if(m.start){picks=m.picks;reset()}
    if(m.order)theirs=m.order;
  }});
function reset(){mine=[...picks];submitted=null;theirs=null}

const truth=()=>[...picks].sort((a,b)=>DATA[b].v-DATA[a].v);
// Score : pays placés au bon rang ; en cas d'égalité, nombre de paires dans le bon ordre
function score(order){
  const t=truth();let exact=0,pairs=0;
  // Deux pays à égalité sont interchangeables : on compare les valeurs, pas les pays
  order.forEach((c,i)=>{if(DATA[t[i]].v===DATA[c].v)exact++});
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(DATA[order[i]].v>=DATA[order[j]].v)pairs++;
  return{exact,pairs};
}

// Glisser-déposer (souris et tactile) : on déplace une ligne avec sa poignée, les autres s'écartent
let dragging=false;
function sortable(list){
  list.querySelectorAll(".rk").forEach(row=>{
    const start=e=>{
      if(e.pointerType!=="mouse"&&!e.target.closest(".handle"))return;
      if(e.button>0)return;
      e.preventDefault();
      const rows=[...list.children],from=rows.indexOf(row);
      const sy0=scrollY,y0=e.clientY;
      const mids=rows.map(r=>{const b=r.getBoundingClientRect();return b.top+sy0+b.height/2});
      const step=rows.length>1?mids[1]-mids[0]:row.offsetHeight;
      let to=from,lastY=y0,raf=0;
      dragging=true;row.classList.add("lift");row.setPointerCapture(e.pointerId);
      const update=()=>{
        const dy=lastY-y0+(scrollY-sy0);
        row.style.transform=`translateY(${dy}px)`;
        const mid=mids[from]+dy;
        to=0;for(let i=0;i<rows.length;i++)if(i!==from&&mids[i]<mid)to++;
        rows.forEach((r,i)=>{
          if(r===row)return;
          let off=0;
          if(from<to&&i>from&&i<=to)off=-step;
          if(from>to&&i<from&&i>=to)off=step;
          r.style.transform=off?`translateY(${off}px)`:"";
        });
      };
      // Défilement automatique quand on approche du bord de l'écran
      const tick=()=>{
        const edge=70;
        if(lastY<edge)scrollBy(0,-Math.ceil((edge-lastY)/6));
        else if(lastY>innerHeight-edge)scrollBy(0,Math.ceil((lastY-innerHeight+edge)/6));
        update();raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
      const move=ev=>{lastY=ev.clientY};
      const end=()=>{
        cancelAnimationFrame(raf);dragging=false;
        row.removeEventListener("pointermove",move);row.removeEventListener("pointerup",end);row.removeEventListener("pointercancel",end);
        const c=mine.splice(from,1)[0];mine.splice(to,0,c);
        render();
      };
      row.addEventListener("pointermove",move);row.addEventListener("pointerup",end);row.addEventListener("pointercancel",end);
    };
    row.addEventListener("pointerdown",start);
  });
}

function render(){
  if(dragging)return;
  const focused=document.activeElement&&document.activeElement.id==="nm";
  let h=`<a class="back" href="../">← Menu</a><h1>${JEU.ico} ${esc(JEU.titre)}</h1>`;
  const common=commonScreen(duo,{intro:"Dès qu'un deuxième joueur arrive, vous choisissez vos prénoms puis la partie démarre. "+JEU.consigne+" Le plus juste gagne."});
  const opn=esc(duo.oppName());
  if(common!==null||!picks){
    h+=common||"";
  }else if(duo.forfeit){
    h+=`<div class="panel"><div class="big" style="font-size:clamp(2rem,9vw,3rem)">${duo.forfeit==="me"?"Tu as abandonné. "+opn+" gagne":opn+" a abandonné. Tu gagnes 🏆"}</div>
      <div class="row" style="justify-content:center"><button id="again">Rejouer</button></div></div>`;
  }else if(submitted&&theirs){
    const t=truth(),a=score(submitted),b=score(theirs);
    const win=a.exact!==b.exact?(a.exact>b.exact?1:-1):a.pairs!==b.pairs?(a.pairs>b.pairs?1:-1):0;
    const res=win>0?"Tu as gagné 🏆":win<0?opn+" a gagné":"Égalité";
    h+=`<div class="score">
      <div class="sc a"><div class="n">${esc(duo.me.name||"Toi")}</div><div class="v">${a.exact}</div></div>
      <div class="mid">bien<br>placés</div>
      <div class="sc b"><div class="n">${opn}</div><div class="v">${b.exact}</div></div></div>
      <div class="panel"><div class="big" style="font-size:clamp(2rem,9vw,3rem)">${res}</div>
      ${a.exact===b.exact?`<p class="mute" style="text-align:center">Égalité de pays bien placés : départagés par les paires dans le bon ordre (${a.pairs} contre ${b.pairs} sur 45).</p>`:""}</div>
      <p class="hint">Le bon classement (${esc(JEU.haut.toLowerCase())} en haut) :</p><div class="rank">`;
    t.forEach((c,i)=>{
      const pa=submitted.indexOf(c),pb=theirs.indexOf(c);
      h+=`<div class="rk"><div class="pos">${i+1}</div><div class="fl">${DATA[c].flag}</div>
        <div class="nm">${esc(DATA[c].name)}<div class="vv" style="text-align:left">${JEU.fmt(DATA[c].v)}</div></div>
        <div class="pp"><span class="a${DATA[t[pa]].v===DATA[c].v?"":" x"}">Toi ${pa+1}</span><span class="b${DATA[t[pb]].v===DATA[c].v?"":" x"}">${opn} ${pb+1}</span></div></div>`;
    });
    h+=`</div><div class="row" style="justify-content:center"><button id="again">Rejouer</button></div>`;
  }else if(submitted){
    h+=`<div class="panel"><h2>Classement envoyé</h2><p class="mute">En attente du classement de ${opn}…</p></div>
      <div class="row" style="justify-content:center"><button class="giveup" id="giveup">Abandonner</button></div>`;
  }else{
    h+=`<p class="hint">${esc(JEU.consigne)}<br>Fais glisser les pays avec la poignée <b>☰</b> : <b>${esc(JEU.haut.toLowerCase())}</b> en haut, <b>${esc(JEU.bas.toLowerCase())}</b> en bas.</p>
      <div class="rank" id="sortable">`;
    mine.forEach((c,i)=>{
      h+=`<div class="rk drag" data-c="${c}"><div class="pos">${i+1}</div><div class="fl">${DATA[c].flag}</div><div class="nm">${esc(DATA[c].name)}</div><div class="handle" aria-label="Déplacer">☰</div></div>`;
    });
    h+=`</div><div class="row"><button id="send">Valider mon classement</button></div>
      <div class="row" style="justify-content:center"><button class="giveup" id="giveup">Abandonner</button></div>`;
  }
  app.innerHTML=h;
  bindCommon(duo,app);
  if(focused){const nm=document.getElementById("nm");if(nm&&!nm.disabled){nm.focus();nm.setSelectionRange(nm.value.length,nm.value.length)}}
  const $=id=>document.getElementById(id);
  const list=$("sortable");if(list)sortable(list);
  if($("send"))$("send").onclick=()=>{submitted=[...mine];duo.send({order:submitted});render()};
  if($("giveup"))$("giveup").onclick=()=>{if(confirm("Abandonner la partie ? Ton adversaire gagnera."))duo.giveUp()};
  if($("again"))$("again").onclick=()=>{picks=null;reset();duo.toRoom()};
}
render();
duo.start();
</script>
</body></html>
